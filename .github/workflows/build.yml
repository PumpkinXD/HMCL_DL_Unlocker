name: build-java

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --warning-mode=all

      # `assemble` depends on `makeWrapped`, so build/libs now holds three
      # artifacts that share one version stem:
      #   <stem>.jar   plain fat jar
      #   <stem>.exe   [Launch5j launcher][jar]
      #   <stem>.sh    [sh stub][jar]
      - name: Resolve artifacts
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          jars=(build/libs/*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::expected exactly one jar in build/libs, found ${#jars[@]}: ${jars[*]:-none}"
            ls -la build/libs || true
            exit 1
          fi

          jar="${jars[0]}"
          name="$(basename "$jar")"
          stem="${name%.jar}"
          exe="${stem}.exe"
          sh="${stem}.sh"

          for f in "$exe" "$sh"; do
            if [ ! -f "build/libs/$f" ]; then
              echo "::error::missing wrapped artifact build/libs/$f (did makeWrapped run?)"
              ls -la build/libs || true
              exit 1
            fi
          done

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "path=${jar}"   >> "$GITHUB_OUTPUT"
          echo "stem=${stem}"  >> "$GITHUB_OUTPUT"
          echo "exe=${exe}"    >> "$GITHUB_OUTPUT"
          echo "sh=${sh}"      >> "$GITHUB_OUTPUT"
          echo "Resolved: ${name} / ${exe} / ${sh}"

      - name: Verify manifests
        shell: bash
        run: |
          set -euo pipefail
          # Exact string compare: no regex escaping, and a package rename only
          # needs this one place changed.
          PKG='io.github.pumpkinxd.hmcl_dl_unlocker'

          # The whole point of the wrapped artifacts is that they are still
          # valid jars, so java -javaagent:<exe>
          # and -javaagent:<sh> work. Reading the manifest out of each one with
          # unzip is the check that this actually held.
          for f in "${{ steps.artifact.outputs.name }}" \
                   "${{ steps.artifact.outputs.exe }}" \
                   "${{ steps.artifact.outputs.sh }}"; do
            unzip -p "build/libs/$f" META-INF/MANIFEST.MF > /tmp/manifest.txt
            echo "--- manifest: $f ---"
            cat /tmp/manifest.txt
            echo "--------------------"

            got="$(sed -n 's/^Main-Class: //p' /tmp/manifest.txt | tr -d '\r')"
            want="${PKG}.Launcher"
            [ "$got" = "$want" ] \
              || { echo "::error::$f: Main-Class is '$got', expected '$want'"; exit 1; }

            got="$(sed -n 's/^Premain-Class: //p' /tmp/manifest.txt | tr -d '\r')"
            want="${PKG}.Agent"
            [ "$got" = "$want" ] \
              || { echo "::error::$f: Premain-Class is '$got', expected '$want'"; exit 1; }

            echo "$f: manifest OK"
          done

      # upload-artifact zips everything, which drops the .sh executable bit.
      # A tarball preserves it, so people who grab the unix artifact can run it
      # without chmod +x.
      - name: Package (preserve executable bit)
        shell: bash
        run: |
          set -euo pipefail
          cd build/libs
          tar czf "../${{ steps.artifact.outputs.stem }}.tar.gz" \
            "${{ steps.artifact.outputs.name }}" \
            "${{ steps.artifact.outputs.exe }}" \
            "${{ steps.artifact.outputs.sh }}"
          tar tvf "../${{ steps.artifact.outputs.stem }}.tar.gz"

      - name: Capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: HMCL_DL_Unlocker
          path: |
            build/libs/${{ steps.artifact.outputs.name }}
            build/libs/${{ steps.artifact.outputs.exe }}
            build/libs/${{ steps.artifact.outputs.sh }}
            build/${{ steps.artifact.outputs.stem }}.tar.gz
          if-no-files-found: error
