name: build-java

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --warning-mode=all

      # The artifact carries a version number, so never hardcode its name.
      - name: Resolve artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::expected exactly one jar in build/libs, found ${#jars[@]}: ${jars[*]:-none}"
            ls -la build/libs || true
            exit 1
          fi
          jar="${jars[0]}"
          name="$(basename "$jar")"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "path=${jar}" >> "$GITHUB_OUTPUT"
          echo "Resolved artifact: ${name}"

      - name: Verify manifest
        shell: bash
        run: |
          set -euo pipefail
          # Exact string compare: no regex escaping, and a package rename only
          # needs this one place changed.
          PKG='io.github.pumpkinxd.hmcl_dl_unlocker'

          unzip -p "${{ steps.artifact.outputs.path }}" META-INF/MANIFEST.MF > /tmp/manifest.txt
          echo "--- manifest ---"
          cat /tmp/manifest.txt
          echo "----------------"

          got="$(sed -n 's/^Main-Class: //p' /tmp/manifest.txt | tr -d '\r')"
          want="${PKG}.Launcher"
          [ "$got" = "$want" ] \
            || { echo "::error::Main-Class is '$got', expected '$want'"; exit 1; }

          got="$(sed -n 's/^Premain-Class: //p' /tmp/manifest.txt | tr -d '\r')"
          want="${PKG}.Agent"
          [ "$got" = "$want" ] \
            || { echo "::error::Premain-Class is '$got', expected '$want'"; exit 1; }

          echo "manifest OK"

      - name: Capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: HMCL_DL_Unlocker
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
